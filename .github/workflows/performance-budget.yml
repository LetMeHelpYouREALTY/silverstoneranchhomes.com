name: Performance Budget Enforcement

on:
  pull_request:
    branches: [main]

jobs:
  performance-budget:
    name: Check Performance Budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check bundle size
        id: bundle-check
        run: |
          # Get JavaScript bundle size
          JS_SIZE=$(find .next/static -name "*.js" -type f -exec du -b {} + | awk '{sum+=$1} END {print sum}')
          JS_SIZE_MB=$(echo "scale=2; $JS_SIZE / 1024 / 1024" | bc)

          # Set budget (5MB for JS)
          BUDGET_MB=5

          echo "JavaScript bundle size: ${JS_SIZE_MB}MB"
          echo "Budget: ${BUDGET_MB}MB"

          if (( $(echo "$JS_SIZE_MB > $BUDGET_MB" | bc -l) )); then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "size=$JS_SIZE_MB" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "size=$JS_SIZE_MB" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR - Budget Exceeded
        if: failure() && steps.bundle-check.outputs.status == 'failed'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ **Performance Budget Exceeded**\n\nJavaScript bundle size: ${steps.bundle-check.outputs.size}MB\nBudget: 5MB\n\nPlease optimize the bundle before merging.`
            })

      - name: Comment on PR - Budget OK
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Performance Budget: PASS**\n\nJavaScript bundle size: ${{ steps.bundle-check.outputs.size }}MB\nBudget: 5MB`
            })
